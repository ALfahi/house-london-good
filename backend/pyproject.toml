[project]
name = "london-vacancy-explorer-backend"
version = "0.1.0"
description = "FastAPI and data pipeline for London Vacancy Explorer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "openpyxl>=3.1,<4",
  "odfpy>=1.4,<2",
  "pyarrow>=17,<23",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0,<2", "shapely>=2.0,<3"]
ml = [
  "torch>=2.5,<3",
  "torch-geometric>=2.6,<3",
  "scikit-learn>=1.5,<2",
]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml"]

